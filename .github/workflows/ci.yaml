---

name: Complete DevOps Project Pipeline 

on:
  push:
    banches:
     - main:


jobs:
  build_and_push:
    runs-on: ubuntu-lastest
    steps:
      - name: Checkout Code
        uses: actions/Checkout@v2
      - name: Set Short SHA
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA}) | cut -c1-7)" >> $GITHUB_ENV"
      - name: Build Docker Image
        run: |
         docker build -t  juanmats99/devops-project-cicd:latest:${{{ env.SHORT_SHA }}} .
      - name: Login to Dockerhub
        run: | 
          echo "${{ secret.DOCKERHUB_TOKEN }}" | docker login -u "{{ secrets.DOCKERHUB_TOKEN_USERNAME }}" --password-stdin
      - name: Push to Dockerhub
        run: | 
           docker push juanmats99/devops-project-cicd:latest:${{{ env.SHORT_SHA }}}

           
      
  