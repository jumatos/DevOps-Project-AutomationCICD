---
name: Complete DevOps Project Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set Short SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build \
            -t juanmats99/devops-project-cicd:${{ env.SHORT_SHA }} \
            -t juanmats99/devops-project-cicd:latest \
            .

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
            -u "${{ secrets.DOCKERHUB_TOKEN_USERNAME }}" \
            --password-stdin

      - name: Push to DockerHub
        run: |
          docker push juanmats99/devops-project-cicd:${{ env.SHORT_SHA }}
          docker push juanmats99/devops-project-cicd:latest